<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 54" width="100%" height="auto">
  <defs>
    <linearGradient id="tickerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01C7F4" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#2590D6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5A4DB9" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#9E24B7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D803B3" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="tickerTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01C7F4"/>
      <stop offset="50%" stop-color="#5A4DB9"/>
      <stop offset="100%" stop-color="#D803B3"/>
    </linearGradient>

    <style>
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes cycleLine1 {
        0%, 18% { opacity: 1; transform: translateY(0); }
        20%, 98% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes cycleLine2 {
        0%, 19% { opacity: 0; transform: translateY(8px); }
        21%, 38% { opacity: 1; transform: translateY(0); }
        40%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleLine3 {
        0%, 39% { opacity: 0; transform: translateY(8px); }
        41%, 58% { opacity: 1; transform: translateY(0); }
        60%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleLine4 {
        0%, 59% { opacity: 0; transform: translateY(8px); }
        61%, 78% { opacity: 1; transform: translateY(0); }
        80%, 100% { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes cycleLine5 {
        0%, 79% { opacity: 0; transform: translateY(8px); }
        81%, 98% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(8px); }
      }

      .status-dot {
        animation: blinkDot 1.8s ease-in-out infinite;
        transform-origin: 32px 27px;
      }
      .line-1 { animation: cycleLine1 16s ease-in-out infinite; }
      .line-2 { animation: cycleLine2 16s ease-in-out infinite; }
      .line-3 { animation: cycleLine3 16s ease-in-out infinite; }
      .line-4 { animation: cycleLine4 16s ease-in-out infinite; }
      .line-5 { animation: cycleLine5 16s ease-in-out infinite; }

      .ticker-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace, sans-serif;
        font-size: 14.5px;
        font-weight: 600;
        fill: #f1f5f9;
        letter-spacing: 0.5px;
      }
      .ticker-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 800;
        fill: #01C7F4;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Outer Pill Container -->
  <rect width="938" height="52" x="1" y="1" rx="26" fill="#0a0f1d" fill-opacity="0.88"/>
  <rect width="938" height="52" x="1" y="1" rx="26" fill="none" stroke="url(#tickerBorder)" stroke-width="1.5"/>

  <!-- Live Status Pulse -->
  <circle cx="32" cy="27" r="5" fill="#01C7F4" class="status-dot"/>
  <circle cx="32" cy="27" r="10" fill="#01C7F4" opacity="0.25" class="status-dot"/>
  <text x="50" y="31" class="ticker-tag">LIVE</text>
  <line x1="90" y1="18" x2="90" y2="36" stroke="#334155" stroke-width="1.2"/>

  <!-- Rotating Headlines -->
  <g class="line-1">
    <text x="108" y="32" class="ticker-text">⚡ Built with Laravel 12 (PHP 8.3 - 8.5), Vue.js 3.4 &amp; Tailwind CSS</text>
  </g>
  <g class="line-2">
    <text x="108" y="32" class="ticker-text">🌗 Zero-Flash System-Aware Dark/Light Mode with Cookie Persistence</text>
  </g>
  <g class="line-3">
    <text x="108" y="32" class="ticker-text">⏳ Branded Orbital Preloader &amp; Glowing Top Route Streaming Progress Bar</text>
  </g>
  <g class="line-4">
    <text x="108" y="32" class="ticker-text">📊 Interactive Kanban Sales Pipeline with Drag-&amp;-Drop Deal Stages</text>
  </g>
  <g class="line-5">
    <text x="108" y="32" class="ticker-text">📱 100% Mobile &amp; Tablet Responsive with Glassmorphic Navigation</text>
  </g>
</svg>
