<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 220" width="100%" height="auto">
  <defs>
    <!-- Background Radial Deep Space Gradient -->
    <radialGradient id="footerBgGrad" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#11182c"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="footerBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01C7F4" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#01C7F4;#2590D6;#5A4DB9;#9E24B7;#D803B3;#01C7F4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5A4DB9" stop-opacity="0.4">
        <animate attributeName="stop-color" values="#5A4DB9;#9E24B7;#D803B3;#01C7F4;#2590D6;#5A4DB9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D803B3" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#D803B3;#01C7F4;#2590D6;#5A4DB9;#9E24B7;#D803B3" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Nexora Flowing Brand Gradient -->
    <linearGradient id="footerBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01C7F4">
        <animate attributeName="stop-color" values="#01C7F4;#2590D6;#5A4DB9;#9E24B7;#D803B3;#01C7F4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#2590D6">
        <animate attributeName="stop-color" values="#2590D6;#5A4DB9;#9E24B7;#D803B3;#01C7F4;#2590D6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#5A4DB9">
        <animate attributeName="stop-color" values="#5A4DB9;#9E24B7;#D803B3;#01C7F4;#2590D6;#5A4DB9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#9E24B7">
        <animate attributeName="stop-color" values="#9E24B7;#D803B3;#01C7F4;#2590D6;#5A4DB9;#9E24B7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#D803B3">
        <animate attributeName="stop-color" values="#D803B3;#01C7F4;#2590D6;#5A4DB9;#9E24B7;#D803B3" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01C7F4" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#5A4DB9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D803B3" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="footerWave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D803B3" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#9E24B7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#01C7F4" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Hexagon Logo Gradients -->
    <linearGradient id="hexGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01C7F4"/>
      <stop offset="100%" stop-color="#2590D6"/>
    </linearGradient>

    <linearGradient id="hexGradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2590D6"/>
      <stop offset="50%" stop-color="#5A4DB9"/>
      <stop offset="100%" stop-color="#9E24B7"/>
    </linearGradient>

    <linearGradient id="hexGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E24B7"/>
      <stop offset="100%" stop-color="#D803B3"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="footerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- CSS Keyframes Fallback / Synergy -->
    <style>
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes spinCw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinCcw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .css-float {
        animation: floatAnim 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background Card -->
  <rect x="2" y="2" width="1196" height="216" rx="16" fill="url(#footerBgGrad)" stroke="url(#footerBorderGrad)" stroke-width="1.5" />

  <!-- Ambient Light Glow Orbs -->
  <circle cx="180" cy="110" r="120" fill="#01C7F4" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.08; 0.18; 0.08" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="110" r="120" fill="#D803B3" opacity="0.14" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.10; 0.22; 0.10" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Center Halo -->
  <circle cx="600" cy="72" r="85" fill="#5A4DB9" opacity="0.22" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.15; 0.38; 0.15" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="75; 95; 75" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Back Dynamic Flowing Wave -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 30 0; 0 0" keyTimes="0; 0.5; 1" dur="8s" repeatCount="indefinite" />
    <path d="M-20,150 C220,110 420,185 680,135 C940,90 1080,165 1240,140 L1240,220 L-20,220 Z" fill="url(#footerWave1)" />
  </g>

  <!-- Front Dynamic Flowing Wave -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; -30 0; 0 0" keyTimes="0; 0.5; 1" dur="6.5s" repeatCount="indefinite" />
    <path d="M-40,165 C180,135 380,195 640,145 C900,105 1060,180 1240,155 L1240,220 L-40,220 Z" fill="url(#footerWave2)" opacity="0.8" />
  </g>

  <!-- Constellation Nodes & Animated Tech Dust -->
  <g>
    <circle cx="140" cy="60" r="2.5" fill="#01C7F4">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2; 3.2; 2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="320" cy="45" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="880" cy="50" r="2" fill="#9E24B7">
      <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <circle cx="1060" cy="65" r="2.5" fill="#D803B3">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2; 3; 2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Constellation Linking Lines -->
  <line x1="140" y1="60" x2="320" y2="45" stroke="#01C7F4" stroke-opacity="0.22" stroke-dasharray="3,3" />
  <line x1="880" y1="50" x2="1060" y2="65" stroke="#D803B3" stroke-opacity="0.22" stroke-dasharray="3,3" />

  <!-- Center Floating Brand Unit (SMIL + CSS Synergy) -->
  <g class="css-float">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" />

    <!-- Outer Orbital Dashed Planetary Ring (Counter-Clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 600 72" to="0 600 72" dur="18s" repeatCount="indefinite" />
      <circle cx="600" cy="72" r="54" fill="none" stroke="#D803B3" stroke-width="1.2" stroke-dasharray="4,7" opacity="0.65" />
      <circle cx="546" cy="72" r="2.8" fill="#D803B3" filter="url(#footerGlow)" />
    </g>

    <!-- Inner Orbital Glowing Planetary Ring (Clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 72" to="360 600 72" dur="12s" repeatCount="indefinite" />
      <circle cx="600" cy="72" r="44" fill="none" stroke="url(#footerBrandGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.85" />
      <circle cx="644" cy="72" r="3.5" fill="#01C7F4" filter="url(#footerGlow)" />
      <circle cx="556" cy="72" r="2.5" fill="#9E24B7" />
    </g>

    <!-- Fast Inner Orbital Tech Ring (Clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 600 72" to="360 600 72" dur="7s" repeatCount="indefinite" />
      <circle cx="600" cy="72" r="35" fill="none" stroke="#2590D6" stroke-width="0.8" stroke-dasharray="2,6" opacity="0.5" />
      <circle cx="600" cy="37" r="2" fill="#01C7F4" />
    </g>

    <!-- Pure Vector Nexora Geometric Brand Icon (Zero External Image Dependency, Ultra Sharp) -->
    <g transform="translate(600, 72) scale(0.9)">
      <!-- Hexagonal Base Plate -->
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#0c1322" stroke="url(#footerBrandGrad)" stroke-width="2" filter="url(#footerGlow)"/>

      <!-- Inner Glowing Geometric Nexora 'N' Emblem -->
      <!-- Left Stem -->
      <path d="M-15,-18 L-7,-18 L-7,18 L-15,18 Z" fill="url(#hexGradLeft)">
        <animate attributeName="opacity" values="0.85; 1; 0.85" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Diagonal Slash -->
      <path d="M-7,-18 L1,-18 L15,18 L7,18 Z" fill="url(#hexGradMid)">
        <animate attributeName="opacity" values="1; 0.75; 1" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Right Stem -->
      <path d="M7,-18 L15,-18 L15,18 L7,18 Z" fill="url(#hexGradRight)">
        <animate attributeName="opacity" values="0.85; 1; 0.85" dur="3s" repeatCount="indefinite"/>
      </path>

      <!-- Central Pulsing Core Light -->
      <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#footerGlow)">
        <animate attributeName="r" values="2.5; 4.5; 2.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Center Typography -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="url(#footerBrandGrad)" letter-spacing="4" filter="url(#footerGlow)">
    NEXORA CRM
  </text>
  <text x="600" y="169" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="2.5">
    NEXT-GENERATION ENTERPRISE ARCHITECTURE &#8226; OPEN SOURCE
  </text>
  <text x="600" y="191" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" letter-spacing="1.2">
    CRAFTED WITH &#9829; BY THE NEXORA CRM COMMUNITY &#8226; MIT LICENSED &#8226; 2026
  </text>

  <!-- Left Accent Pill: Built with Laravel & Vue -->
  <g transform="translate(60, 85)">
    <rect width="180" height="30" rx="15" fill="#0c1322" stroke="#01C7F4" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#01C7F4">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#93C5FD">
      Laravel 12 + Vue 3.4
    </text>
  </g>

  <!-- Right Accent Pill: Zero-FOUC Dark/Light -->
  <g transform="translate(960, 85)">
    <rect width="180" height="30" rx="15" fill="#0c1322" stroke="#D803B3" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="4" fill="#D803B3">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#F472B6">
      Adaptive Dark/Light
    </text>
  </g>
</svg>
